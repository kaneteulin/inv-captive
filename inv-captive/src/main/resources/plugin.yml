name: InvCaptive
main: com.github.monun.invcaptive.plugin.InvCaptivePlugin
api-version: '26.3'
version: ${version}
authors: [ Noonmaru, kaneteulin ]

commands:
  invcaptive:
    description: 인벤토리 잠금 초기화 / 상태 확인
    usage: /invcaptive [list|status]

permissions:
  # /invcaptive (초기화), /invcaptive list
  invcaptive.command:
    default: op
  # /invcaptive status
  invcaptive.status:
    default: true
